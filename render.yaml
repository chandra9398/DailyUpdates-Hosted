services:
  - type: web
    name: dailyupdates
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    disk:
      name: dailyupdates-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DAILYUPDATES_DATA_DIR
        value: /var/data
      - key: DAILYUPDATES_SECRET
        generateValue: true
