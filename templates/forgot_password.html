
{% extends "base.html" %}
{% block title %}Forgot Password · DailyUpdates{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3 fw-bold mb-2">Forgot Password?</h1>

    <p class="text-secondary">
      Enter your registered email address.
      We will send you a one-time password (OTP).
    </p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="email">
          Registered Email *
        </label>

        <input
          class="form-control"
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          placeholder="Enter your registered email">
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Send OTP
      </button>
    </form>

    <p class="mt-3 mb-0 text-center">
      <a href="{{ url_for('login') }}">
        Back to Login
      </a>
    </p>
  </div>
</div>
{% endblock %}
