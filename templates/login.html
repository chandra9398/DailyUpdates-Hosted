{% extends "base.html" %}{% block title %}Login · DailyUpdates{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <h1 class="h3 fw-bold mb-2">Welcome back</h1><p class="text-secondary">Sign in to view your daily updates.</p>
  <form method="post">
    <label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" required autocomplete="username">
    <label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
  <div class="hint mt-3"><strong>First-run admin:</strong> username <code>admin</code>, password <code>Admin@123</code>. Change this before real use.</div>
</div></div>
{% endblock %}
