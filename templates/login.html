
{% extends "base.html" %}
{% block title %}Login · DailyUpdates{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3 fw-bold mb-2">Welcome back</h1>
    <p class="text-secondary">Sign in to view your daily updates.</p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="login">
          Username or Email *
        </label>
        <input class="form-control"
               id="login"
               name="login"
               type="text"
               required
               autocomplete="username"
               placeholder="Enter username or email">
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">
          Password *
        </label>
        <input class="form-control"
               id="password"
               name="password"
               type="password"
               required
               autocomplete="current-password"
               placeholder="Enter password">
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Login
      </button>
    </form>

    <!-- Forgot Password link -->
    <p class="mt-3 mb-0 text-center">
      <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
      </a>
    </p>

    <p class="mt-3 mb-0">
      New user?
      <a href="{{ url_for('register') }}">Create an account</a>
    </p>

    <div class="hint mt-3">
      <strong>First-run admin:</strong>
      username <code>admin</code>,
      password <code>Admin@123</code>.
      Change this before real use.
    </div>
  </div>
</div>
{% endblock %}
