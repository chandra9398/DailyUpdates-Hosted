
{% extends "base.html" %}
{% block title %}Create Update · DailyUpdates{% endblock %}

{% block content %}
<div class="form-panel">
  <h1 class="h2 fw-bold mb-1">Create Daily Update</h1>
  <p class="text-secondary mb-4">
    Publish an announcement, note, image, or document.
  </p>

  <form method="post" enctype="multipart/form-data">

    <div class="mb-3">
      <label class="form-label">Title *</label>
      <input class="form-control"
             name="title"
             maxlength="150"
             required
             placeholder="Enter update title">
    </div>

    <div class="mb-3">
      <label class="form-label">Description *</label>
      <textarea class="form-control"
                name="body"
                rows="6"
                required
                placeholder="Write your update here..."></textarea>
    </div>

    <!-- Share with: Category and Priority removed -->
    <div class="mb-3">
      <label class="form-label">Share with</label>
      <select class="form-select" name="audience">
        <option>All Users</option>
        <option disabled>Selected-user sharing: coming next</option>
      </select>
    </div>

    <div class="mt-3 mb-4">
      <label class="form-label">
        Attach image or document (optional)
      </label>
      <input class="form-control"
             type="file"
             name="attachment"
             accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.doc,.docx">
      <div class="form-text">
        Allowed: images, PDF, TXT, DOC, DOCX. Maximum request size: 10 MB.
      </div>
    </div>

    <button class="btn btn-primary">Publish Update</button>
    <a class="btn btn-outline-secondary"
       href="{{ url_for('dashboard') }}">Cancel</a>

  </form>
</div>
{% endblock %}
