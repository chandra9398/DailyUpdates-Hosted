```html
<div class="col-lg-7">
  <h2 class="h5 fw-bold mb-3">
    Saved notes ({{ notes|length }})
  </h2>

  <div class="d-grid gap-3">
    {% for note in notes %}
    <article class="update-card">

      <div class="d-flex justify-content-between align-items-start gap-2">
        <h3 class="h6 fw-bold mb-1">{{ note.title }}</h3>
        <span class="text-secondary small">
          {{ note.updated_at.replace('T',' ') }}
        </span>
      </div>

      <details class="mt-2">
        <summary style="cursor: pointer;">
          Click to view full note
        </summary>

        <div class="mt-2"
             style="white-space: pre-wrap; overflow-wrap: anywhere;">{{ note.body }}</div>
      </details>

      <div class="d-flex gap-2 mt-3">
        <a class="btn btn-sm btn-outline-primary"
           href="{{ url_for('notes', edit=note.id) }}">
          Edit
        </a>

        <form method="post"
              action="{{ url_for('delete_note', note_id=note.id) }}"
              onsubmit="return confirm('Delete this note?')">
          <button class="btn btn-sm btn-outline-danger">
            Delete
          </button>
        </form>
      </div>

    </article>
    {% else %}
    <div class="empty-state">
      <div class="display-6">📝</div>
      <h3 class="h6">No saved notes yet</h3>
      <p class="text-secondary mb-0">
        Create your first note using the form.
      </p>
    </div>
    {% endfor %}
  </div>
</div>
```
