{% extends "base.html" %}{% block title %}Users · DailyUpdates{% endblock %}
{% block content %}
<h1 class="h2 fw-bold mb-3">Registered Users</h1>
<div class="table-responsive form-panel"><table class="table align-middle"><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Registered</th></tr></thead><tbody>
{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.username }}</td><td>{{ user.role }}</td><td>{{ user.created_at.replace('T',' ') }}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
