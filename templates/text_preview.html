{% extends "base.html" %}{% block title %}Open Text · DailyUpdates{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div><h1 class="h3 fw-bold mb-1">{{ file.original_name }}</h1><p class="text-secondary mb-0">Text file preview</p></div>
  <div class="d-flex gap-2"><a class="btn btn-outline-primary" href="{{ url_for('download_user_file', file_id=file.id) }}">Download</a><a class="btn btn-outline-secondary" href="{{ url_for('my_files') }}">Back to files</a></div>
</div>
<section class="form-panel"><pre class="mb-0 text-break" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto">{{ content }}</pre></section>
{% endblock %}
