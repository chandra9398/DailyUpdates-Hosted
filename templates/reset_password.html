
{% extends "base.html" %}
{% block title %}Reset Password · DailyUpdates{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3 fw-bold mb-2">Reset Password</h1>

    <p class="text-secondary">
      Enter the OTP sent to your email and choose a new password.
    </p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="email">
          Registered Email *
        </label>

        <input
          class="form-control"
          id="email"
          name="email"
          type="email"
          value="{{ request.args.get('email', '') }}"
          required
          autocomplete="email"
          placeholder="Enter your registered email">
      </div>

      <div class="mb-3">
        <label class="form-label" for="otp">
          Six-Digit OTP *
        </label>

        <input
          class="form-control"
          id="otp"
          name="otp"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          required
          autocomplete="one-time-code"
          placeholder="Enter 6-digit OTP">
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">
          New Password *
        </label>

        <input
          class="form-control"
          id="password"
          name="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Minimum 8 characters">
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirm_password">
          Confirm New Password *
        </label>

        <input
          class="form-control"
          id="confirm_password"
          name="confirm_password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Re-enter your new password">
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Reset Password
      </button>
    </form>

    <p class="mt-3 mb-0 text-center">
      <a href="{{ url_for('forgot_password') }}">
        Request a new OTP
      </a>
      |
      <a href="{{ url_for('login') }}">
        Back to Login
      </a>
    </p>
  </div>
</div>
{% endblock %}
