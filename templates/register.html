
{% extends "base.html" %}
{% block title %}Register · DailyUpdates{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <h1 class="h3 fw-bold mb-2">Create account</h1>
    <p class="text-secondary">
      Register to receive updates from the admin.
    </p>

    <form method="post">

      <!-- Username -->
      <label class="form-label" for="username">
        Username *
      </label>
      <input
        class="form-control mb-3"
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="80"
        autocomplete="username"
        placeholder="Enter username"
        required>

      <!-- Email -->
      <label class="form-label" for="email">
        Email address *
      </label>
      <input
        class="form-control mb-3"
        id="email"
        name="email"
        type="email"
        maxlength="254"
        autocomplete="email"
        placeholder="Enter email address"
        required>

      <!-- Password -->
      <label class="form-label" for="password">
        Password (minimum 8 characters) *
      </label>
      <input
        class="form-control mb-3"
        id="password"
        name="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Create password"
        required>

      <button class="btn btn-primary w-100">
        Register
      </button>

    </form>

    <p class="mt-3 mb-0">
      Already registered?
      <a href="{{ url_for('login') }}">Login</a>
    </p>

  </div>
</div>
{% endblock %}
