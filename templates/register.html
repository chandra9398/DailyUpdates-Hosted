{% extends "base.html" %}{% block title %}Register · DailyUpdates{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <h1 class="h3 fw-bold mb-2">Create account</h1><p class="text-secondary">Register to receive updates from the admin.</p>
  <form method="post">
    <label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" minlength="3" required>
    <label class="form-label" for="password">Password (minimum 8 characters)</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="8" required>
    <button class="btn btn-primary w-100">Register</button>
  </form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>
{% endblock %}
